<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>20/10</title>
    <link rel="stylesheet" href="thiep20.css" />
  </head>
  <body>
    <div class="container">
      <div id="xt" class="xac-thuc">Mật khẩu chính xác</div>
      <div class="hearts-container"></div>
      <div class="pass-card" id="pass-card">
        <h2>Nhập pass nha</h2>
        <!-- Các ô dấu chấm thể hiện mật khẩu đã nhập -->
        <div class="dots-container">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <!-- Bàn phím số -->
        <div class="keypad">
          <button class="key">1</button>
          <button class="key">2</button>
          <button class="key">3</button>
          <button class="key">4</button>
          <button class="key">5</button>
          <button class="key">6</button>
          <button class="key">7</button>
          <button class="key">8</button>
          <button class="key">9</button>
          <button class="key">0</button>
          <button class="key">❌</button>
        </div>
      </div>
      <div class="bo-hoa" id="hoa">
        <img src="image/hoa.jpg" alt="Bó hoa siêu đẹp" />
      </div>
      <div style="display: none" id="btn">
        <button class="btn">Chạm vào đii</button>
      </div>
      <div class="message" id="mes">
        <p></p>
        <button id="nut-dong" class="btn1">Đóng</button>
      </div>
    </div>
  </body>
  <script src="thiep20.js"></script>
</html>
